<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="code-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bg-grad-api)" />
  <rect x="0.5" y="0.5" width="599" height="359" rx="15.5" fill="none" stroke="rgba(255,255,255,0.12)" />

  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#1e293b" />
  <rect y="30" width="600" height="12" fill="#1e293b" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  
  <rect x="120" y="10" width="360" height="22" rx="6" fill="#0f172a" />
  <text x="300" y="25" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">api.vyankateshwar.dev/v1/students/manage</text>

  <!-- Method & URL Pill -->
  <rect x="30" y="62" width="70" height="26" rx="6" fill="#10b981" />
  <text x="65" y="79" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle">POST</text>

  <rect x="110" y="62" width="320" height="26" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="125" y="79" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="12">/api/v1/students/enroll/</text>

  <rect x="440" y="62" width="130" height="26" rx="6" fill="#065f46" />
  <text x="505" y="79" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">201 CREATED</text>

  <!-- Left Code Editor Mockup -->
  <rect x="30" y="104" width="310" height="224" rx="10" fill="#090d16" stroke="rgba(129,140,248,0.25)" />
  
  <text x="45" y="128" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">// DRF ModelSerializer &amp; JWT Verification</text>
  <text x="45" y="150" fill="#818cf8" font-family="'Fira Code', monospace" font-size="11">class</text>
  <text x="85" y="150" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11"> StudentSerializer</text>
  <text x="235" y="150" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">(serializers.Model):</text>
  <text x="60" y="172" fill="#f472b6" font-family="'Fira Code', monospace" font-size="11">class</text>
  <text x="100" y="172" fill="#fde047" font-family="'Fira Code', monospace" font-size="11"> Meta:</text>
  <text x="80" y="194" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">model = Student</text>
  <text x="80" y="214" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">fields = ['id', 'roll_no', 'status']</text>
  <text x="80" y="234" fill="#34d399" font-family="'Fira Code', monospace" font-size="11">read_only_fields = ['created_at']</text>
  
  <rect x="45" y="254" width="280" height="58" rx="8" fill="rgba(129,140,248,0.1)" stroke="rgba(129,140,248,0.3)" />
  <text x="55" y="274" fill="#a5b4fc" font-family="'Fira Code', monospace" font-size="10">JWT Authorization: Bearer eyJhbGci...</text>
  <text x="55" y="294" fill="#34d399" font-family="'Fira Code', monospace" font-size="10">Response Time: 42ms | MySQL DB Conn: Active</text>

  <!-- Right Response Mockup -->
  <rect x="355" y="104" width="215" height="224" rx="10" fill="#090d16" stroke="rgba(56,189,248,0.25)" />
  <rect x="355" y="104" width="215" height="30" rx="10" fill="#1e293b" />
  <text x="370" y="124" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">JSON Response</text>

  <text x="370" y="156" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">{</text>
  <text x="382" y="176" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">"status"</text>
  <text x="440" y="176" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">: </text>
  <text x="452" y="176" fill="#34d399" font-family="'Fira Code', monospace" font-size="11">201</text>
  <text x="475" y="176" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">,</text>

  <text x="382" y="196" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">"student_id"</text>
  <text x="466" y="196" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">: </text>
  <text x="382" y="214" fill="#fde047" font-family="'Fira Code', monospace" font-size="11">"VP-STU-2026"</text>
  <text x="480" y="214" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">,</text>

  <text x="382" y="234" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">"role"</text>
  <text x="424" y="234" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">: </text>
  <text x="436" y="234" fill="#fde047" font-family="'Fira Code', monospace" font-size="11">"ADMIN"</text>
  <text x="490" y="234" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">,</text>

  <text x="382" y="254" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">"enrolled"</text>
  <text x="450" y="254" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">: </text>
  <text x="462" y="254" fill="#a5b4fc" font-family="'Fira Code', monospace" font-size="11">true</text>

  <text x="370" y="278" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">}</text>

  <!-- MySQL badge -->
  <rect x="370" y="296" width="185" height="22" rx="6" fill="#00758f" opacity="0.3" stroke="#00758f" />
  <text x="462" y="311" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle">MySQL Relational DB Verified</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ecom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b1d" />
      <stop offset="100%" stop-color="#0f2b38" />
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bg-grad-ecom)" />
  <rect x="0.5" y="0.5" width="599" height="359" rx="15.5" fill="none" stroke="rgba(255,255,255,0.12)" />

  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#132832" />
  <rect y="30" width="600" height="12" fill="#132832" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  
  <rect x="120" y="10" width="360" height="22" rx="6" fill="#091b1d" />
  <text x="300" y="25" fill="#5eead4" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">store.vyankateshwar.dev/shop</text>

  <!-- Store Navbar -->
  <rect x="30" y="58" width="540" height="40" rx="8" fill="#152e3c" stroke="rgba(255,255,255,0.08)" />
  <text x="50" y="83" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15">TechStore<tspan fill="#f43f5e">.</tspan></text>
  
  <rect x="160" y="66" width="230" height="24" rx="12" fill="#091b1d" />
  <text x="180" y="82" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Search products, tech gear...</text>

  <rect x="440" y="66" width="115" height="24" rx="12" fill="#0284c7" />
  <text x="497" y="82" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">🛒 Cart (3 Items)</text>

  <!-- Product Card 1 -->
  <g transform="translate(30, 114)">
    <rect width="168" height="216" rx="10" fill="url(#card-grad-1)" stroke="rgba(255,255,255,0.1)" />
    <!-- Product image area -->
    <rect x="12" y="12" width="144" height="100" rx="8" fill="#1e293b" />
    <circle cx="84" cy="62" r="28" fill="#0284c7" opacity="0.3" />
    <text x="84" y="69" fill="#38bdf8" font-size="28" text-anchor="middle">⌨️</text>

    <text x="14" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Mechanical RGB</text>
    <text x="14" y="148" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Hot-swap switches</text>
    <text x="14" y="172" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">₹ 4,499</text>
    
    <rect x="14" y="184" width="140" height="24" rx="6" fill="#0284c7" />
    <text x="84" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Product Card 2 -->
  <g transform="translate(216, 114)">
    <rect width="168" height="216" rx="10" fill="url(#card-grad-1)" stroke="rgba(129,140,248,0.3)" />
    <rect x="12" y="12" width="144" height="100" rx="8" fill="#1e293b" />
    <circle cx="84" cy="62" r="28" fill="#818cf8" opacity="0.3" />
    <text x="84" y="69" fill="#818cf8" font-size="28" text-anchor="middle">🎧</text>

    <text x="14" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">ANC Wireless Headset</text>
    <text x="14" y="148" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">40hr battery life</text>
    <text x="14" y="172" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">₹ 6,299</text>
    
    <rect x="14" y="184" width="140" height="24" rx="6" fill="#4f46e5" />
    <text x="84" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle">In Cart (1)</text>
  </g>

  <!-- Product Card 3 -->
  <g transform="translate(402, 114)">
    <rect width="168" height="216" rx="10" fill="url(#card-grad-1)" stroke="rgba(255,255,255,0.1)" />
    <rect x="12" y="12" width="144" height="100" rx="8" fill="#1e293b" />
    <circle cx="84" cy="62" r="28" fill="#10b981" opacity="0.3" />
    <text x="84" y="69" fill="#10b981" font-size="28" text-anchor="middle">⌚</text>

    <text x="14" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Fitness Smartwatch</text>
    <text x="14" y="148" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">AMOLED &amp; Heart Rate</text>
    <text x="14" y="172" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">₹ 3,199</text>
    
    <rect x="14" y="184" width="140" height="24" rx="6" fill="#0284c7" />
    <text x="84" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle">Add to Cart</text>
  </g>
</svg>
